services:
  breeder-fix:
    build: .
    container_name: breeder-fix
    ports:
      - "8000:8000"
    volumes:
      - breeder_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  breeder_data:
